<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานผลกีฬา นครเขื่อนขันธ์เกมส์ 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 4px solid #3b82f6; color: #1d4ed8; font-weight: bold; }
        .color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .dot-white { border: 1px solid #ccc; }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-blue-800 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 text-center">
            <h1 class="text-3xl font-bold mb-2">🏆 นครเขื่อนขันธ์เกมส์ 2026</h1>
            <p class="text-blue-200">ระบบรายงานผลการแข่งขันกีฬาเครือข่ายสุขภาพสัมพันธ์</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <div class="bg-white rounded-t-lg shadow-sm overflow-x-auto flex whitespace-nowrap mb-6">
            <button onclick="changeSport('VB_M')" id="tab_VB_M" class="tab-btn tab-active px-6 py-3 hover:bg-gray-50 transition">🏐 วอลเลย์บอล ชาย</button>
            <button onclick="changeSport('VB_W')" id="tab_VB_W" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">🏐 วอลเลย์บอล หญิง</button>
            <button onclick="changeSport('TK_M')" id="tab_TK_M" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">⚽ ตะกร้อ ชาย</button>
            <button onclick="changeSport('TK_W')" id="tab_TK_W" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">⚽ ตะกร้อ หญิง</button>
            <button onclick="changeSport('PT_M')" id="tab_PT_M" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">🪨 เปตอง ชาย</button>
            <button onclick="changeSport('PT_W')" id="tab_PT_W" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">🪨 เปตอง หญิง</button>
            <button onclick="changeSport('FB_M')" id="tab_FB_M" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">⚽ ฟุตบอล ชาย</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-5 rounded-lg shadow-sm border-t-4 border-red-500">
                <h3 class="text-xl font-bold text-gray-700 mb-4">สาย A</h3>
                <ul id="groupA_list" class="space-y-2"></ul>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border-t-4 border-blue-500">
                <h3 class="text-xl font-bold text-gray-700 mb-4">สาย B</h3>
                <ul id="groupB_list" class="space-y-2"></ul>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-4">ผลการแข่งขันล่าสุด</h2>
        <div id="matches_container" class="space-y-4">
            <div class="text-center p-8 bg-white rounded-lg text-gray-500 italic animate-pulse">กำลังโหลดข้อมูลจาก Google Sheets...</div>
        </div>
    </main>

    <script>
        // *** 1. ใส่ลิงก์ CSV จาก Google Sheets ของคุณที่นี่ ***
        const csvUrl = "ใส่ลิงก์_CSV_ของคุณที่นี่";

        const teams = {
            1: { name: 'อบจ.หนองบัวลำภู', color: '#e91e63' },
            2: { name: 'อำเภอโนนสัง', color: '#f97316' },
            3: { name: 'อำเภอนากลาง', color: '#ef4444' },
            4: { name: 'อำเภอนาวัง', color: '#a855f7' },
            5: { name: 'สสจ.+ เมือง', color: '#ffffff', isWhite: true },
            6: { name: 'รพ.หนองบัวลำภู', color: '#22c55e' },
            7: { name: 'อำเภอศรีบุญเรือง', color: '#0ea5e9' },
            8: { name: 'อำเภอสุวรรณคูหา', color: '#1e3a8a' },
            99: { name: 'อ.นากลาง + อ.นาวัง', color: 'linear-gradient(to right, #ef4444, #a855f7)' } 
        };

        const groupings = {
            default: { groupA: [1, 2, 3, 4], groupB: [5, 6, 7, 8] },
            football: { groupA: [1, 2, 99], groupB: [5, 6, 7, 8] }
        };

        let currentSport = 'VB_M';

        async function fetchData() {
            if (csvUrl.includes("ใส่ลิงก์")) return; // ข้ามถ้ายังไม่ได้ใส่ลิงก์

            try {
                const res = await fetch(csvUrl);
                const csvText = await res.text();
                const rows = csvText.split('\n').slice(1);
                
                const matches = rows.map(row => {
                    const col = row.split(',');
                    return { sport_id: col[0]?.trim(), t1: col[1]?.trim(), t2: col[2]?.trim(), s1: col[3]?.trim(), s2: col[4]?.trim(), status: col[5]?.trim() };
                }).filter(m => m.sport_id === currentSport);

                renderMatches(matches);
            } catch (e) {
                console.error("Fetch Error:", e);
            }
        }

        function renderMatches(matches) {
            const container = document.getElementById('matches_container');
            if (matches.length === 0) {
                container.innerHTML = '<div class="text-center p-8 bg-white rounded-lg text-gray-500">ไม่พบข้อมูลการแข่งขันประเภทนี้</div>';
                return;
            }

            container.innerHTML = matches.map(m => {
                const t1 = teams[m.t1] || { name: '?', color: '#ccc' };
                const t2 = teams[m.t2] || { name: '?', color: '#ccc' };
                const isLive = m.status?.includes('กำลังแข่งขัน');
                
                return `
                <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center border border-gray-100">
                    <div class="w-2/5 flex items-center">
                        <span class="color-dot ${t1.isWhite?'dot-white':''}" style="background:${t1.color}"></span>
                        <span class="font-bold text-sm md:text-lg">${t1.name}</span>
                    </div>
                    <div class="w-1/5 text-center">
                        <div class="bg-gray-100 px-3 py-1 rounded font-black text-xl">${m.s1} - ${m.s2}</div>
                        <div class="text-xs mt-1 ${isLive?'text-red-500 animate-pulse font-bold':'text-gray-400'}">${m.status}</div>
                    </div>
                    <div class="w-2/5 flex items-center justify-end">
                        <span class="font-bold text-sm md:text-lg text-right">${t2.name}</span>
                        <span class="color-dot ml-2 ${t2.isWhite?'dot-white':''}" style="background:${t2.color}"></span>
                    </div>
                </div>`;
            }).join('');
        }

        function changeSport(id) {
            currentSport = id;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('tab_'+id).classList.add('tab-active');
            
            // แสดงรายชื่อทีมตามประเภทกีฬา
            const layout = (id === 'FB_M') ? groupings.football : groupings.default;
            const renderT = (tid) => `<li class="flex items-center text-sm p-1"><span class="color-dot ${teams[tid].isWhite?'dot-white':''}" style="background:${teams[tid].color}"></span>${teams[tid].name}</li>`;
            document.getElementById('groupA_list').innerHTML = layout.groupA.map(renderT).join('');
            document.getElementById('groupB_list').innerHTML = layout.groupB.map(renderT).join('');
            
            fetchData();
        }

        // เริ่มต้น และดึงข้อมูลทุก 30 วินาที
        changeSport('VB_M');
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
