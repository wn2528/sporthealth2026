<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานผลกีฬา นครเขื่อนขันธ์เกมส์ 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 4px solid #3b82f6; color: #1d4ed8; font-weight: bold; }
        .color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .dot-white { border: 1px solid #ccc; }
        
        /* สไตล์สำหรับโลโก้แบบมีเงาแวววาวและแอนิเมชัน */
        .animated-logo {
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
            animation: shimmer 3s infinite linear;
        }
        @keyframes shimmer {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.8; transform: scale(1); }
        }
        
        /* สไตล์สำหรับมัสคอสตกแต่ง */
        .mascot-decoration {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: auto;
            opacity: 0.7;
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-blue-800 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 text-center">
            <img src="logo.png" alt="โลโก้ นครเขื่อนขันธ์เกมส์" class="animated-logo h-24 mx-auto mb-4">
            <h1 class="text-3xl font-bold mb-1">🏆 นครเขื่อนขันธ์เกมส์ 2026</h1>
            <p class="text-blue-200">แข่งขันระหว่างวันที่ 6 - 16 พ.ค. 2569</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <div class="bg-white rounded-t-lg shadow-sm overflow-x-auto flex whitespace-nowrap mb-6">
            <button onclick="changeSport('VB_M')" id="tab_VB_M" class="tab-btn tab-active px-6 py-3 hover:bg-gray-50 transition">🏐 วอลเลย์บอล ชาย</button>
            <button onclick="changeSport('VB_W')" id="tab_VB_W" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">🏐 วอลเลย์บอล หญิง</button>
            <button onclick="changeSport('TK_M')" id="tab_TK_M" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">⚽ ตะกร้อ ชาย</button>
            <button onclick="changeSport('PT_M')" id="tab_PT_M" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">🪨 เปตอง ชาย</button>
            <button onclick="changeSport('FB_M')" id="tab_FB_M" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">⚽ ฟุตบอล ชาย</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-5 rounded-lg shadow-sm border-t-4 border-blue-600">
                <h3 class="text-xl font-bold text-gray-700 mb-4">📊 ตารางคะแนนการแข่งขัน</h3>
                <div id="standings_container" class="space-y-6">
                    </div>
            </div>
            
            <div class="bg-white p-5 rounded-lg shadow-sm border-t-4 border-red-500">
                <h3 class="text-xl font-bold text-gray-700 mb-4">⏱️ ผลการแข่งขันล่าสุด</h3>
                <div id="matches_container" class="space-y-4">
                    </div>
            </div>
        </div>
    </main>

    <img src="mascot.png" alt="มัสคอส นครเขื่อนขันธ์เกมส์" class="mascot-decoration">

    <script>
        // *** 1. ใส่ลิงก์ CSV ของคุณที่นี่ ***
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSE56LtlPBfLIudlMLOcdGssPUQ2SzBZG7GF48ecmrxXT9I2nHaypoEi5rGNfCh-w2n1Uxh-x1U7GpN/pubhtml";

        const sportNames = {
            'VB_M': 'วอลเลย์บอล ชาย', 'VB_W': 'วัอลเลย์บอล หญิง',
            'TK_M': 'ตะกร้อ ชาย', 'PT_M': 'เปตอง ชาย', 'FB_M': 'ฟุตบอล ชาย'
        };

        const teamStyles = {
            'อบจ.หนองบัวลำภู': { color: '#e91e63' },
            'อำเภอโนนสัง': { color: '#f97316' },
            'อำเภอนากลาง': { color: '#ef4444' },
            'อำเภอนาวัง': { color: '#a855f7' },
            'สสจ.+ เมือง': { color: '#ffffff', isWhite: true },
            'รพ.หนองบัวลำภู': { color: '#22c55e' },
            'อำเภอศรีบุญเรือง': { color: '#0ea5e9' },
            'อำเภอสุวรรณคูหา': { color: '#1e3a8a' },
            'อ.นากลาง + อ.นาวัง': { color: 'linear-gradient(to right, #ef4444, #a855f7)' }
        };

        let currentSport = 'VB_M';

        function getTeam(name) {
            return teamStyles[name] || { color: '#e2e8f0', isPlaceholder: true };
        }

        async function fetchData() {
            if (csvUrl.includes("ใส่ลิงก์")) return;
            try {
                const res = await fetch(csvUrl);
                const csvText = await res.text();
                const rows = csvText.split('\n').slice(1);
                
                const matches = rows.map(row => {
                    const col = row.split(',');
                    if(col.length < 9) return null;
                    return {
                        sport: col[0]?.trim(), round: col[1]?.trim(),
                        date: col[2]?.trim(), time: col[3]?.trim(),
                        t1: col[4]?.trim(), s1: parseInt(col[5]) || 0,
                        s2: parseInt(col[6]) || 0, t2: col[7]?.trim(),
                        status: col[8]?.trim()
                    };
                }).filter(m => m !== null && m.sport === sportNames[currentSport]);

                renderMatches(matches);
                renderStandings(matches);
            } catch (e) { console.error("Error:", e); }
        }

        function createMatchCard(m) {
            const isLive = m.status === 'กำลังแข่งขัน 🔴';
            const t1 = getTeam(m.t1);
            const t2 = getTeam(m.t2);
            
            return `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between text-[10px] text-gray-400 mb-2 font-medium">
                    <span>🗓️ ${m.date || '-'} | 🕒 ${m.time || '-'}</span>
                    <span class="bg-gray-100 px-2 py-0.5 rounded text-blue-600">สาย/รอบ ${m.round}</span>
                </div>
                <div class="flex items-center justify-between">
                    <div class="w-2/5 text-center">
                        <div class="flex flex-col items-center">
                            <span class="w-3 h-3 rounded-full mb-1 ${t1.isWhite?'border':''}" style="background:${t1.color}"></span>
                            <span class="text-xs font-bold truncate w-full">${m.t1}</span>
                        </div>
                    </div>
                    <div class="w-1/5 text-center">
                        <div class="text-lg font-black text-blue-900">${m.s1}-${m.s2}ผมขอสรุปแนวทางการออกแบบและตัวอย่างไฟล์ HTML ต้นแบบฉบับสมบูรณ์ที่พร้อมใช้งานตามที่คุณต้องการ เพื่อให้เว็บไซต์รายงานผลและตารางคะแนนกีฬา **"นครเขื่อนขันธ์เกมส์ 2026"** ดูสวยงาม ทันสมัย และเป็นมืออาชีพมากยิ่งขึ้นครับ

### **แนวทางการออกแบบเว็บไซต์ (Design Concept)**

* **โลโก้ (Logo):** ออกแบบให้เป็นโลโก้ที่มีเอฟเฟกต์แวววาว (Glossy Effect) และใช้แอนิเมชันแบบเคลื่อนไหวเล็กน้อย (Animated Glimmer) เพื่อดึงดูดสายตาและให้ความรู้สึกทันสมัย
* **ข้อความ (Text):** เพิ่มข้อความ **"แข่งขันระหว่างวันที่ 6 - 16 พ.ค. 2569"** บริเวณด้านล่างของหัวข้อหลัก เพื่อแจ้งข้อมูลเวลาที่ชัดเจน
* **มัสคอส (Mascot):** ออกแบบมัสคอสรูปกระต่ายสวมชุดกีฬาที่ดูน่ารักและเป็นมิตร นำมาตกแต่งบริเวณมุมต่างๆ ของเว็บไซต์เพื่อเพิ่มความมีชีวิตชีวา
* **ตารางคะแนน (Standings Table):** ใช้การไฮไลท์สีพื้นหลังอ่อนๆ ให้กับ **อันดับ 1 และอันดับ 2 ของตาราง** เพื่อให้ง่ายต่อการสังเกตทีมที่ได้เข้ารอบ
* **UI สไตล์ Dashboard:** ปรับ Layout เป็น 2 คอลัมน์ (สำหรับหน้าจอคอมพิวเตอร์) โดยให้ตารางคะแนนอยู่ด้านซ้าย และผลการแข่งขันอยู่ด้านขวา เพื่อให้เห็นภาพรวมได้ชัดเจน

### **โค้ด HTML ต้นแบบ (index.html)**

คุณเจสามารถคัดลอกโค้ดด้านล่างนี้ ไปวางในไฟล์ `index.html` บน GitHub เพื่อดูหน้าตาและทดลองเล่นระบบได้ทันทีเลยครับ

```html
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานผลกีฬา นครเขื่อนขันธ์เกมส์ 2026</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap)" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 4px solid #3b82f6; color: #1d4ed8; font-weight: bold; }
        .color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .dot-white { border: 1px solid #ccc; }
        
        /* สไตล์สำหรับโลโก้แบบมีเงาแวววาวและแอนิเมชัน */
        .animated-logo {
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
            animation: shimmer 3s infinite linear;
        }
        @keyframes shimmer {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.8; transform: scale(1); }
        }
        
        /* สไตล์สำหรับมัสคอสตกแต่ง */
        .mascot-decoration {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: auto;
            opacity: 0.7;
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-blue-800 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 text-center">
            <img src="logo.png" alt="โลโก้ นครเขื่อนขันธ์เกมส์" class="animated-logo h-24 mx-auto mb-4">
            <h1 class="text-3xl font-bold mb-1">🏆 นครเขื่อนขันธ์เกมส์ 2026</h1>
            <p class="text-blue-200">แข่งขันระหว่างวันที่ 6 - 16 พ.ค. 2569</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <div class="bg-white rounded-t-lg shadow-sm overflow-x-auto flex whitespace-nowrap mb-6">
            <button onclick="changeSport('VB_M')" id="tab_VB_M" class="tab-btn tab-active px-6 py-3 hover:bg-gray-50 transition">🏐 วอลเลย์บอล ชาย</button>
            <button onclick="changeSport('VB_W')" id="tab_VB_W" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">🏐 วอลเลย์บอล หญิง</button>
            <button onclick="changeSport('TK_M')" id="tab_TK_M" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">⚽ ตะกร้อ ชาย</button>
            <button onclick="changeSport('PT_M')" id="tab_PT_M" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">🪨 เปตอง ชาย</button>
            <button onclick="changeSport('FB_M')" id="tab_FB_M" class="tab-btn px-6 py-3 hover:bg-gray-50 transition">⚽ ฟุตบอล ชาย</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-5 rounded-lg shadow-sm border-t-4 border-blue-600">
                <h3 class="text-xl font-bold text-gray-700 mb-4">📊 ตารางคะแนนการแข่งขัน</h3>
                <div id="standings_container" class="space-y-6">
                    </div>
            </div>
            
            <div class="bg-white p-5 rounded-lg shadow-sm border-t-4 border-red-500">
                <h3 class="text-xl font-bold text-gray-700 mb-4">⏱️ ผลการแข่งขันล่าสุด</h3>
                <div id="matches_container" class="space-y-4">
                    </div>
            </div>
        </div>
    </main>

    <img src="mascot.png" alt="มัสคอส นครเขื่อนขันธ์เกมส์" class="mascot-decoration">

    <script>
        // *** 1. ใส่ลิงก์ CSV ของคุณที่นี่ ***
        const csvUrl = "ใส่ลิงก์_CSV_ของคุณที่นี่";

        const sportNames = {
            'VB_M': 'วอลเลย์บอล ชาย', 'VB_W': 'วัอลเลย์บอล หญิง',
            'TK_M': 'ตะกร้อ ชาย', 'PT_M': 'เปตอง ชาย', 'FB_M': 'ฟุตบอล ชาย'
        };

        const teamStyles = {
            'อบจ.หนองบัวลำภู': { color: '#e91e63' },
            'อำเภอโนนสัง': { color: '#f97316' },
            'อำเภอนากลาง': { color: '#ef4444' },
            'อำเภอนาวัง': { color: '#a855f7' },
            'สสจ.+ เมือง': { color: '#ffffff', isWhite: true },
            'รพ.หนองบัวลำภู': { color: '#22c55e' },
            'อำเภอศรีบุญเรือง': { color: '#0ea5e9' },
            'อำเภอสุวรรณคูหา': { color: '#1e3a8a' },
            'อ.นากลาง + อ.นาวัง': { color: 'linear-gradient(to right, #ef4444, #a855f7)' }
        };

        let currentSport = 'VB_M';

        function getTeam(name) {
            return teamStyles[name] || { color: '#e2e8f0', isPlaceholder: true };
        }

        async function fetchData() {
            if (csvUrl.includes("ใส่ลิงก์")) return;
            try {
                const res = await fetch(csvUrl);
                const csvText = await res.text();
                const rows = csvText.split('\n').slice(1);
                
                const matches = rows.map(row => {
                    const col = row.split(',');
                    if(col.length < 9) return null;
                    return {
                        sport: col[0]?.trim(), round: col[1]?.trim(),
                        date: col[2]?.trim(), time: col[3]?.trim(),
                        t1: col[4]?.trim(), s1: parseInt(col[5]) || 0,
                        s2: parseInt(col[6]) || 0, t2: col[7]?.trim(),
                        status: col[8]?.trim()
                    };
                }).filter(m => m !== null && m.sport === sportNames[currentSport]);

                renderMatches(matches);
                renderStandings(matches);
            } catch (e) { console.error("Error:", e); }
        }

        function createMatchCard(m) {
            const isLive = m.status === 'กำลังแข่งขัน 🔴';
            const t1 = getTeam(m.t1);
            const t2 = getTeam(m.t2);
            
            return `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between text-[10px] text-gray-400 mb-2 font-medium">
                    <span>🗓️ ${m.date || '-'} | 🕒 ${m.time || '-'}</span>
                    <span class="bg-gray-100 px-2 py-0.5 rounded text-blue-600">สาย/รอบ ${m.round}</span>
                </div>
                <div class="flex items-center justify-between">
                    <div class="w-2/5 text-center">
                        <div class="flex flex-col items-center">
                            <span class="w-3 h-3 rounded-full mb-1 ${t1.isWhite?'border':''}" style="background:${t1.color}"></span>
                            <span class="text-xs font-bold truncate w-full">${m.t1}</span>
                        </div>
                    </div>
                    <div class="w-1/5 text-center">
                        <div class="text-lg font-black text-blue-900">${m.s1}-${m.s2}</div>
                    </div>
                    <div class="w-2/5 text-center">
                        <div class="flex flex-col items-center">
                            <span class="w-3 h-3 rounded-full mb-1 ${t2.isWhite?'border':''}" style="background:${t2.color}"></span>
                            <span class="text-xs font-bold truncate w-full">${m.t2}</span>
                        </div>
                    </div>
                </div>
                <div class="mt-2 text-center text-[10px] ${isLive?'text-red-500 font-bold live-pulse rounded-full py-0.5 bg-red-50':'text-gray-400'}">${m.status}</div>
            </div>`;
        }

        function renderStandings(matches) {
            const container = document.getElementById('standings_container');
            container.innerHTML = '';
            
            ['A', 'B'].forEach(group => {
                const groupMatches = matches.filter(m => m.round === group);
                const stats = {};

                // ค้นหาทีมทั้งหมดในสาย
                groupMatches.forEach(m => {
                    [m.t1, m.t2].forEach(t => { if(!stats[t]) stats[t] = { name: t, p: 0, w: 0, l: 0, pts: 0 }; });
                });

                // คำนวณแต้ม (จะคำนวณก็ต่อเมื่อมีคำว่า "จบ" ในสถานะ)
                groupMatches.filter(m => m.status && m.status.includes('จบ')).forEach(m => {
                    stats[m.t1].p++; stats[m.t2].p++;
                    if(m.s1 > m.s2) { stats[m.t1].w++; stats[m.t1].pts += 3; stats[m.t2].l++; }
                    else if(m.s2 > m.s1) { stats[m.t2].w++; stats[m.t2].pts += 3; stats[m.t1].l++; }
                    else { stats[m.t1].pts += 1; stats[m.t2].pts += 1; }
                });

                const sorted = Object.values(stats).sort((a, b) => b.pts - a.pts || b.w - a.w);

                container.innerHTML += `
                <div class="border rounded-xl overflow-hidden">
                    <div class="bg-blue-50 py-2 px-4 text-center border-b font-bold text-blue-800 text-sm">สาย ${group}</div>
                    <table class="w-full text-[11px] md:text-xs">
                        <thead class="bg-gray-50 text-gray-400">
                            <tr>
                                <th class="py-2 pl-2 text-left font-medium">ทีม</th>
                                <th class="text-center font-medium">ชนะ</th>
                                <th class="text-center font-bold text-blue-600">แต้ม</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            ${sorted.map((s, i) => {
                                const stl = getTeam(s.name);
                                return `<tr class="${i<2?'bg-green-50/50':''}">
                                    <td class="py-2 pl-2 font-bold flex items-center">
                                        <span class="w-3 inline-block text-gray-300 font-normal mr-1">${i+1}</span>
                                        <span class="color-dot w-2 h-2 ${stl.isWhite?'border':''}" style="background:${stl.color}"></span>
                                        <span class="truncate w-24 md:w-auto">${s.name}</span>
                                    </td>
                                    <td class="text-center text-green-600">${s.w}</td>
                                    <td class="text-center font-black text-blue-700 bg-blue-50/20">${s.pts}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>`;
            });
        }

        function changeSport(id) {
            currentSport = id;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('tab_'+id).classList.add('tab-active');
            fetchData();
        }

        // เริ่มต้นระบบ
        changeSport('VB_M');
        setInterval(fetchData, 30000); 
    </script>
</body>
</html>
